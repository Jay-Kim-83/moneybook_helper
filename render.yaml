services:
  - type: web
    name: moneybook-helper
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: INGEST_KEY
        sync: false
      - key: DATA_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
